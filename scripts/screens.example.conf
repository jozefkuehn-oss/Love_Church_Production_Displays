# Which display opens on which Mac mini output.
# One line per screen:  <profile>  <x>  <y>
# x/y are where that output sits in macOS System Settings → Displays → Arrange.
# With outputs side by side at 1920x1080: first is 0 0, second 1920 0, third 3840 0.
# Profiles: broadcast, dock, greenroom, foh, stage (or any you add in the admin page).
#
# Love Church Elkhorn South: the Mac mini's HDMI outputs go into the switcher /
# hub as sources, which then route them to the rooms:
#   Output 1 → Broadcast Control (Broadcast Bottom / Audio TV, or the multiview)
#   Output 2 → Green Room
# The Dock and Broadcast Top TVs are independent of the switcher; each gets its
# own small browser box (see SETUP.md), so they aren't listed here.
broadcast  0     0
greenroom  1920  0
