# Which display opens on which Mac mini output.
# One line per screen:  <profile>  <x>  <y>
# x/y are where that output sits in macOS System Settings → Displays → Arrange.
# With outputs side by side at 1920x1080: first is 0 0, second 1920 0, third 3840 0.
# Profiles: broadcast, dock, greenroom, foh, stage (or any you add in the admin page).
#
# Love Church Elkhorn South (TV list, Oct 2026):
#   Through the switcher — the Mac mini's outputs are switcher sources and get
#   routed to: Green Room (Samsung UN55TU8000), Broadcast Bottom (TCL),
#   Broadcast Audio (Samsung UN43TU8000), Broadcast Multiview 1/2 (LG OLED).
#     Output 1 → broadcast    Output 2 → greenroom
#   Not on the switcher:
#     Broadcast Top (TCL 48FS3750, a Roku TV, no usable browser) → plug it
#       straight into a third Mac mini output (M4 Mac minis drive three
#       displays), or give it a streaming stick with a kiosk browser.
#     Dock (Samsung UN65TU850D on an Apple TV — tvOS has no web browser) →
#       streaming stick with a kiosk browser, or an HDMI run from the Mac mini.
#   Confidence monitors stay on FOH ProPresenter; lobby and Love Kids NECs
#   aren't part of this app.
# Every dashboard TV runs on its own over the network (docs/TV-SETUP.md),
# so by default the Mac opens no screens of its own. Uncomment a line only if
# a monitor is plugged straight into the Mac mini.
# broadcast  0     0
# greenroom  1920  0
# broadcast  3840  0     # third output straight to Broadcast Top, if the Mac mini has one
