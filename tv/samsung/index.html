<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>LC Displays</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0E0E0F; color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; }
  #frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #0E0E0F; }
  #panel { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 28px; padding: 0 160px; background: #0E0E0F; }
  #panel[hidden], #frame[hidden] { display: none; }
  .k { font-size: 26px; letter-spacing: .18em; font-weight: 800; color: #E6007E; }
  h1 { margin: 0; font-size: 76px; font-weight: 800; line-height: 1.05; }
  p { margin: 0; font-size: 34px; line-height: 1.4; color: #B4B4BA; max-width: 1500px; }
  p b { color: #fff; }
  .bar { width: 120px; height: 8px; border-radius: 4px; background: #E6007E; }
</style>
</head>
<body>
<iframe id="frame" hidden allow="autoplay"></iframe>
<div id="panel">
  <div class="k">LOVE CHURCH · PRODUCTION DISPLAYS</div>
  <h1 id="title">Starting…</h1>
  <p id="msg"></p>
  <div class="bar"></div>
</div>
<script src="$WEBAPIS/webapis/webapis.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
